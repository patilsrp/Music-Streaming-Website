<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Odyssey</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="overlay">
        <form method="POST" action="login.php"> <!-- Updated method and action -->
          <div class="con">
            <header class="head-form">
              <h2>Log In</h2>
              <p>Login here using your username and password</p>
            </header>
            <br>
            <div class="field-set">
              <!-- Username -->
              <span class="input-item">
                <i class="fa fa-user-circle"></i>
              </span>
              <input class="form-input" id="username" name="username" type="text" placeholder="UserName" required>
              <br>

              <!-- Password -->
              <span class="input-item">
                <i class="fa fa-key"></i>
              </span>
              <input class="form-input" type="password" placeholder="Password" id="password" name="password" required>
              <br>

              <!-- Remember Me checkbox -->
              <label>
                <input type="checkbox" name="remember"> Remember Me
              </label>
              <br>

              <!-- LogIn button -->
              <button class="log-in" type="submit">Log In</button>
            </div>

            <div class="other">
              <button class="btn submits frgt-pass">Forgot Password</button>
            
              <button class="btn submits sign-up">Sign Up
                <i class="fa fa-user-plus" aria-hidden="true"></i></button>
            </div>
          </div>
        </form>
      </div>
      <script src="scripts/login.js"></script>

</body>
</html>
