<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Odyssey</title>
    <link rel="stylesheet" href="styles/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="overlay">
    <form method="POST" action="signup.php"> <!-- Updated method and action -->
      <div class="con">
        <header class="head-form">
          <h2>Sign Up</h2>
          <p>Sign-Up here using your username, email, and password</p>
        </header>
        <br>
        <div class="field-set">
          <!-- Email Input -->
          <span class="input-item">
            <i class="fa fa-envelope"></i>
          </span>
          <input class="form-input" id="email" type="email" name="email" placeholder="Email" required>
          <br>

          <!-- Username Input -->
          <span class="input-item">
            <i class="fa fa-user-circle"></i>
          </span>
          <input class="form-input" id="username" type="text" name="username" placeholder="UserName" required>
          <br>
          <span class="input-item">
            <i class="fa fa-key"></i>
          </span>
          <input class="form-input" type="password" placeholder="Password" id="pwd" name="password" required>
          <br>
          <button class="sign-up" type="submit">Sign-Up
            <i class="fa fa-user-plus" aria-hidden="true"></i>
          </button>
          
        </div>
          <div class="other">
          <button class="btn submits login" type="button">Login instead</button>
            
            
          </div>
      </div>
    </form>
  </div>
  <script src="scripts/register.js"></script>

</body>

</html>
